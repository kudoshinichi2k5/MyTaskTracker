deploymentMode: SingleBinary

# ==========================================
# PHẦN 1: CẤU HÌNH POD VÀ TẮT COMPONENT PHỤ
# (Nằm ở cấp ngoài cùng)
# ==========================================
serviceAccount:
  create: true
  name: loki-sa
  annotations:
    azure.workload.identity/client-id: "f7ddc777-ddb1-4756-87c9-b092e7d2d1b3"

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podLabels:
    azure.workload.identity/use: "true"

# Tắt các chế độ phân tán
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Tắt hoàn toàn Cache và Canary để tiết kiệm RAM
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: monitoring

# ==========================================
# PHẦN 2: CẤU HÌNH LÕI CỦA PHẦN MỀM LOKI
# (BẮT BUỘC phải thụt lề trong block `loki:`)
# ==========================================
loki:
  auth_enabled: false
  
  server:
    http_listen_port: 3100
    
  commonConfig:
    replication_factor: 1

  compactor:
    retention_enabled: true
    delete_request_store: azure

  # Cấu hình Storage đẩy về Azure Blob
  storage:
    type: azure
    bucketNames:
      chunks: loki-chunks
      ruler: loki-chunks
      admin: loki-chunks
    azure:
      containerName: loki-chunks
      accountName: "salokitasktrackerdev"
      useFederatedToken: true
      userAssignedId: "f7ddc777-ddb1-4756-87c9-b092e7d2d1b3"

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    # Tuyệt đối KHÔNG gõ thêm `enforce_metric_name` vào đây
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 168h
    allow_structured_metadata: false
