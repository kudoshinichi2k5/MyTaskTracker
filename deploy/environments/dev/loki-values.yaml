auth_enabled: false

server:
  http_listen_port: 3100

common:
  replication_factor: 1

# Ép hoàn toàn sang chế độ SingleBinary, tắt các subchart phân tán gây lỗi PVC
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    create: true
    name: loki-sa
    annotations:
      azure.workload.identity/client-id: "f7ddc777-ddb1-4756-87c9-b092e7d2d1b3" # Thay bằng Client ID thực tế từ Terraform output nếu cần
  podLabels:
    azure.workload.identity/use: "true"

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Tắt hoàn toàn cache để tránh lỗi thiếu RAM trên node ARM64
chunksCache:
  enabled: false
resultsCache:
  enabled: false

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: azure
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

storage_config:
  azure:
    container_name: loki-chunks
    account_name: "sabackupvalkeydev" # Thay bằng Storage Account thực tế của bạn
    use_managed_identity: true
    user_assigned_id: "f7ddc777-ddb1-4756-87c9-b092e7d2d1b3"

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false

# Tắt canary và test để tiết kiệm tài nguyên
lokiCanary:
  enabled: false
test:
  enabled: false