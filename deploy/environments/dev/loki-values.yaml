deploymentMode: SingleBinary

loki:
  auth_enabled: false
  
  server:
    http_listen_port: 3100
    
  commonConfig:
    replication_factor: 1

  storage:
    type: azure
    bucketNames:
      chunks: loki-chunks
      ruler: loki-chunks
      admin: loki-chunks
    azure:
      container_name: loki-chunks
      account_name: "salokitasktrackerdev" # Đã sửa từ 'storage_account_name' thành 'account_name'
      use_managed_identity: true
      user_assigned_id: "f7ddc777-ddb1-4756-87c9-b092e7d2d1b3"
  
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    allow_structured_metadata: false

# Cấu hình Pod SingleBinary
singleBinary:
  replicas: 1
  serviceAccount:
    create: true
    name: loki-sa
    annotations:
      azure.workload.identity/client-id: "f7ddc777-ddb1-4756-87c9-b092e7d2d1b3"
  podLabels:
    azure.workload.identity/use: "true"

# Tắt các components dư thừa trong SingleBinary mode
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
test:
  enabled: false

# ---- THÊM ĐOẠN DƯỚI ĐÂY ĐỂ FIX LỖI THIẾU RAM CỦA LOKI CACHE ----
chunksCache:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

resultsCache:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi