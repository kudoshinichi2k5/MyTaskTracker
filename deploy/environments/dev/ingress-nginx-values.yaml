controller:
  # Số lượng replica của NGINX (để 2 cho High Availability nếu cần, ở dev thì 1 cũng được)
  replicaCount: 1

  # Cấu hình Service LoadBalancer
  service:
    externalTrafficPolicy: Local
    # Gắn Static Public IP mà Terraform đã tạo
    loadBalancerIP: "65.52.163.27"
    
    annotations:
      # BẮT BUỘC: Báo cho AKS biết IP này nằm ở RG khác (không phải node_resource_group mặc định)
      service.beta.kubernetes.io/azure-load-balancer-resource-group: "rg-tasktracker-shared"

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      # Thêm nhãn này để Prometheus của chúng ta nhận diện được ServiceMonitor này
      additionalLabels:
        release: monitoring

    port: 10254
    grafanaDashboards:
      # Báo cho NGINX tự động đẩy Dashboard của nó lên K8s (dùng chính bản ID 9614)
      enabled: true
      # Phải trùng khớp với labelValue mà Sidecar của Grafana đang tìm kiếm
      namespace: "monitoring" # Đặt ConfigMap vào đúng nhà của Grafana