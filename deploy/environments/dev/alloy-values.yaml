controller:
  type: daemonset

  # Mỗi node chạy một Alloy pod để thu thập log cục bộ.
  # discovery.kubernetes bên dưới cũng giới hạn theo spec.nodeName.
  podLabels:
    app.kubernetes.io/component: log-collector

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring

serviceAccount:
  create: true

alloy:
  configMap:
    create: true
    content: |
      // 1. Khám phá các pod đang chạy trên cùng node với Alloy
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(env("HOSTNAME"), constants.hostname)
        }
      }

      // 2. Lọc log từ các pod trong namespace dev và ingress-nginx
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action = "keep"
          regex = "dev|ingress-nginx"
        }

        // THIẾT KẾ NHÃN CARDINALITY THẤP (Task 3)
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      // 3. Đọc file log từ K8s
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.kubernetes_logs.receiver]
      }

      // 4. Giữ nguyên log gốc. Backend .NET ghi JSON, còn ingress-nginx ghi text;
      // parse chung cho cả hai loại có thể làm mất dòng text của ingress.
      loki.process "kubernetes_logs" {
        forward_to = [loki.write.endpoint.receiver]
      }

      // 5. Đẩy log về Loki Gateway
      loki.write "endpoint" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }
