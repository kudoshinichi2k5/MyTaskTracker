fullnameOverride: "customer-app"
image:
  repository: "frontend/customerapp"
  tag: "c035718307ac0601c7cd91bb3fa1f2645e4d0f04"
service:
  port: 80
env: {} # Frontend SPA Nginx không cần truyền biến môi trường Runtime kiểu backend

keyvault:
  enabled: false

migration:
  enabled: false

# KHAI BÁO PROBE CHO NGINX
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5

ingress:
  enabled: true
  hosts:
    # Customer App dùng domain gốc và www
    - host: mytasktracker.work.gd
      paths:
        - path: /
          pathType: Prefix
    - host: www.mytasktracker.work.gd
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wildcard-tls-secret
      hosts:
        - mytasktracker.work.gd
        - www.mytasktracker.work.gd