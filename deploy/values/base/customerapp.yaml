fullnameOverride: "customer-app"
image:
  repository: "frontend/customerapp"
  tag: "b068e30e3bd6b743c1cec8fa67a3e48a7041fdef"
service:
  port: 80
env: {} # Frontend SPA Nginx không cần truyền biến môi trường Runtime kiểu backend

keyvault:
  enabled: false # TẮT TÍNH NĂNG NÀY

# KHAI BÁO PROBE CHO NGINX
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5