fullnameOverride: "task-service"
image:
  repository: "backend/taskservice"
  tag: "65b456f3509b34a154e814855a346d5ee95c9bc7"
service:
  port: 80
env:
  ASPNETCORE_ENVIRONMENT: "Development"

# secretEnv:
#   ConnectionStrings__TaskDb: "Server=tracker-mariadb.dev.svc.cluster.local;Port=3306;Database=tracker_tasks;User=task_service;Password=newtaskpassword888;"
#   AuthService__BaseUrl: "http://auth-service"
#   AuthService__VerifyPath: "/verify"
#   AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"

keyvault:
  enabled: true
  clientId: "ef5bcef9-60bd-42d1-ba23-66e98e9fd7a0" # Bạn lấy từ Terraform output
  secretsMap:
    # Key: Tên Secret được lưu trong Azure Key Vault (Bạn phải tạo thủ công trên Portal)
    # Value: Tên Biến Môi Trường sẽ được K8s bơm vào cho ứng dụng .NET
    "TaskDbConnectionString": "ConnectionStrings__TaskDb"

migration:
  enabled: true
  dllName: "Tracker.TaskService.dll"

# KHAI BÁO PROBE CHO .NET
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10