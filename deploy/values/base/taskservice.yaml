fullnameOverride: "task-service"
image:
  repository: "backend/taskservice"
  tag: "8d2961620a2805258bb3855a2309668b0f4d4e30"
service:
  port: 80
env:
  ASPNETCORE_ENVIRONMENT: "Development"
  ConnectionStrings__TaskDb: "Server=tracker-mariadb.dev.svc.cluster.local;Port=3306;Database=tracker_tasks;User=task_service;Password=devtaskpassword;"
  AuthService__BaseUrl: "http://auth-service"
  AuthService__VerifyPath: "/verify"
  AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"

migration:
  enabled: true
  dllName: "Tracker.TaskService.dll"

# KHAI BÁO PROBE CHO .NET
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10