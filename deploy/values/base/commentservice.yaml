fullnameOverride: "comment-service"
image:
  repository: "backend/commentservice"
  tag: "d6a64255a1237ef0fce8512d098a701dcdb9cf50"
service:
  port: 80
env:
  ASPNETCORE_ENVIRONMENT: "Development"

secretEnv:
  ConnectionStrings__CommentDb: "Server=tracker-mariadb.dev.svc.cluster.local;Port=3306;Database=tracker_comments;User=comment_service;Password=newcommentpassword888;"
