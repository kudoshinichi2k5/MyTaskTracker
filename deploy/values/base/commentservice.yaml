fullnameOverride: "comment-service"
image:
  repository: "backend/commentservice"
  tag: "b068e30e3bd6b743c1cec8fa67a3e48a7041fdef"
service:
  port: 80
env:
  ASPNETCORE_ENVIRONMENT: "Development"

# secretEnv:
#   ConnectionStrings__CommentDb: "Server=tracker-mariadb.dev.svc.cluster.local;Port=3306;Database=tracker_comments;User=comment_service;Password=newcommentpassword888;"
#   AuthService__BaseUrl: "http://auth-service"
#   AuthService__VerifyPath: "/verify"
#   AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"

keyvault:
  enabled: true
  secretsMap:
    # Key: Tên Secret được lưu trong Azure Key Vault (Bạn phải tạo thủ công trên Portal)
    # Value: Tên Biến Môi Trường sẽ được K8s bơm vào cho ứng dụng .NET
    "comment-service-connection-string": "ConnectionStrings__CommentDb"

migration:
  enabled: true
  dllName: "Tracker.CommentService.dll"

# KHAI BÁO PROBE CHO .NET
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10