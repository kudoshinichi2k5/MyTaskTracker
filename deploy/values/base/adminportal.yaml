fullnameOverride: "admin-portal"
image:
  repository: "frontend/adminportal"
  tag: "3955b6ad49011af5de486ae41337418222c3d97f"
service:
  port: 80
env: {} # Frontend SPA Nginx không cần truyền biến môi trường Runtime kiểu backend

keyvault:
  enabled: false

migration:
  enabled: false

# KHAI BÁO PROBE CHO NGINX
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5

ingress:
  enabled: true
  hosts:
    - host: admin.mytasktracker.work.gd
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wildcard-tls-secret
      hosts:
        - admin.mytasktracker.work.gd