fullnameOverride: "project-service"
image:
  repository: "backend/projectservice"
  tag: "bb61162541fb208e460108cd9f2d65a423c0aa8e"
service:
  port: 80
env:
  ASPNETCORE_ENVIRONMENT: "Development"
  AuthService__BaseUrl: "http://auth-service.dev.svc.cluster.local"
  AuthService__VerifyPath: "/verify"
  AllowedFrontendOrigins: "https://mytasktracker.work.gd,https://www.mytasktracker.work.gd,https://admin.mytasktracker.work.gd"

# secretEnv:
#   ConnectionStrings__ProjectDb: "Server=tracker-mariadb.dev.svc.cluster.local;Port=3306;Database=tracker_projects;User=project_service;Password=newprojectpassword888;"
#   AuthService__BaseUrl: "http://auth-service"
#   AuthService__VerifyPath: "/verify"
#   AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"

keyvault:
  enabled: true
  secretsMap:
    # Key: Tên Secret được lưu trong Azure Key Vault (Bạn phải tạo thủ công trên Portal)
    # Value: Tên Biến Môi Trường sẽ được K8s bơm vào cho ứng dụng .NET
    "project-service-connection-string": "ConnectionStrings__ProjectDb"

migration:
  enabled: true
  dllName: "Tracker.ProjectService.dll"

# KHAI BÁO PROBE CHO .NET
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # --- RATE LIMITING THOÁNG HƠN CHO PROJECT SERVICE ---
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-req-status-code: "429"
  hosts:
    - host: api.mytasktracker.work.gd
      paths:
        - path: /projects/(.*)
          pathType: Prefix
  tls:
    - secretName: wildcard-tls-secret
      hosts:
        - api.mytasktracker.work.gd

# KHAI BÁO RESOURCES BẮT BUỘC ĐỂ HPA HOẠT ĐỘNG
resources:
  requests:
    cpu: 50m      # 0.05 vCPU
    memory: 128Mi
  limits:
    cpu: 300m      # Tối đa 0.3 vCPU
    memory: 512Mi

# BẬT HPA
autoscaling:
  enabled: true
  minReplicas: 2   # Luôn chạy ít nhất 2 pod để test tính stateless và sẵn sàng (HA)
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70 # Nếu 2 pod đều chạy hơn 70% CPU -> Tạo thêm pod số 3