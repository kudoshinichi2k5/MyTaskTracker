fullnameOverride: "project-service"
image:
  repository: "backend/projectservice"
  tag: "3955b6ad49011af5de486ae41337418222c3d97f"
service:
  port: 80
env:
  ASPNETCORE_ENVIRONMENT: "Development"
  AuthService__BaseUrl: "http://auth-service.dev.svc.cluster.local"
  AuthService__VerifyPath: "/verify"
  AllowedFrontendOrigins: "https://mytasktracker.work.gd,https://www.mytasktracker.work.gd,https://admin.mytasktracker.work.gd"

# secretEnv:
#   ConnectionStrings__ProjectDb: "Server=tracker-mariadb.dev.svc.cluster.local;Port=3306;Database=tracker_projects;User=project_service;Password=newprojectpassword888;"
#   AuthService__BaseUrl: "http://auth-service"
#   AuthService__VerifyPath: "/verify"
#   AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"

keyvault:
  enabled: true
  secretsMap:
    # Key: Tên Secret được lưu trong Azure Key Vault (Bạn phải tạo thủ công trên Portal)
    # Value: Tên Biến Môi Trường sẽ được K8s bơm vào cho ứng dụng .NET
    "project-service-connection-string": "ConnectionStrings__ProjectDb"

migration:
  enabled: true
  dllName: "Tracker.ProjectService.dll"

# KHAI BÁO PROBE CHO .NET
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
  hosts:
    - host: api.mytasktracker.work.gd
      paths:
        - path: /projects/(.*)
          pathType: Prefix
  tls:
    - secretName: wildcard-tls-secret
      hosts:
        - api.mytasktracker.work.gd