fullnameOverride: "auth-service" # Định danh cố định để các service khác gọi
image:
  repository: "backend/authservice" 
  tag: "5be6f42080ea0d4f197fe7109b13335cb46a78f3"
env:
  ASPNETCORE_ENVIRONMENT: "Development"
  AllowedFrontendOrigins: "https://mytasktracker.work.gd,https://www.mytasktracker.work.gd,https://admin.mytasktracker.work.gd"
  # Tên DNS nội bộ của MariaDB sẽ là: <tên-release>-<tên-chart>.<namespace>.svc.cluster.local
  # Trong trường hợp này là: tracker-mariadb.dev.svc.cluster.local
  ConnectionStrings__Valkey: "tracker-valkey-primary.dev.svc.cluster.local:6379,password=$(VALKEY_PASSWORD)"

keyvault:
  enabled: true
  secretsMap:
    # Key: Tên Secret được lưu trong Azure Key Vault (Bạn phải tạo thủ công trên Portal)
    # Value: Tên Biến Môi Trường sẽ được K8s bơm vào cho ứng dụng .NET
    "auth-service-connection-string": "ConnectionStrings__AuthDb"
    "valkey-password": "VALKEY_PASSWORD" 

service:
  port: 80 # Bên ngoài cụm nội bộ gọi port 80, K8s sẽ trỏ vào containerPort 8080

migration:
  enabled: true
  dllName: "Tracker.AuthService.dll"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10

backup:
  enabled: true

ingress:
  enabled: true
  annotations:
    # Rewrite target để NGINX cắt bỏ chữ /auth trước khi đưa request vào cho .NET
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # --- THÊM CẤU HÌNH RATE LIMITING CHO AUTH SERVICE ---
    # Giới hạn số lượng kết nối đồng thời từ 1 IP: 10 kết nối
    nginx.ingress.kubernetes.io/limit-connections: "10"
    
    # Giới hạn tốc độ request: 5 request/giây trên mỗi IP (Cho phép burst thêm 10 request)
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    
    # Khi vượt hạn mức, trả về lỗi 429 (Too Many Requests)
    nginx.ingress.kubernetes.io/limit-req-status-code: "429"
  hosts:
    - host: api.mytasktracker.work.gd
      paths:
        - path: /auth/(.*)
          pathType: Prefix
  tls:
    - secretName: wildcard-tls-secret
      hosts:
        - api.mytasktracker.work.gd

# KHAI BÁO RESOURCES BẮT BUỘC ĐỂ HPA HOẠT ĐỘNG
resources:
  requests:
    cpu: 50m      # 0.05 vCPU
    memory: 128Mi
  limits:
    cpu: 300m      # Tối đa 0.3 vCPU
    memory: 512Mi

# BẬT HPA
autoscaling:
  enabled: true
  minReplicas: 2   # Luôn chạy ít nhất 2 pod để test tính stateless và sẵn sàng (HA)
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70 # Nếu 2 pod đều chạy hơn 70% CPU -> Tạo thêm pod số 3

monitoring:
  serviceMonitor:
    enabled: true
