fullnameOverride: "auth-service" # Định danh cố định để các service khác gọi
image:
  repository: "backend/authservice" 
  tag: "11a010945053f4345708a41359f78d63c3a89546"
env:
  ASPNETCORE_ENVIRONMENT: "Development"
  # Tên DNS nội bộ của MariaDB sẽ là: <tên-release>-<tên-chart>.<namespace>.svc.cluster.local
  # Trong trường hợp này là: tracker-mariadb.dev.svc.cluster.local

secretEnv:
  ConnectionStrings__AuthDb: "Server=tracker-mariadb.dev.svc.cluster.local;Port=3306;Database=tracker_auth;User=auth_service;Password=newauthpassword888;"

service:
  port: 80 # Bên ngoài cụm nội bộ gọi port 80, K8s sẽ trỏ vào containerPort 8080

migration:
  enabled: true
  dllName: "Tracker.AuthService.dll"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10