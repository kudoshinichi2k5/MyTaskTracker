apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservice.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "microservice.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "microservice.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if .Values.keyvault.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- if .Values.env }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "microservice.fullname" . }} # Tên ServiceAccount
      containers:
        - name: {{ include "microservice.fullname" . }}
          # Lấy Registry từ biến global, ghép với tên repository và tag
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }} # Sẽ là 8080 cho Backend, thay đổi tuỳ service
              protocol: TCP

          {{- if or .Values.env .Values.keyvault.enabled }}
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ include "microservice.fullname" . }}-config
            {{- end }}
            {{- if .Values.keyvault.enabled }}
            - secretRef:
                name: {{ include "microservice.fullname" . }}-synced-secret
            {{- end }}
          {{- end }}

          # THÊM MỚI: Mount ổ đĩa ảo của CSI
          {{- if .Values.keyvault.enabled }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}

          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}

          # 1. CẤU HÌNH RESOURCES CHO HPA TÍNH TOÁN
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}

          # 2. GRACEFUL SHUTDOWN: PRESTOP HOOK
          lifecycle:
            preStop:
              exec:
                # Ngủ 15 giây trước khi tắt ứng dụng. Giúp NGINX và Kube-proxy có đủ thời gian gỡ IP của Pod này ra khỏi Service endpoint.
                command: ["/bin/sleep", "15"]

      # 3. GRACEFUL SHUTDOWN: TERMINATION GRACE PERIOD
      # Tổng thời gian K8s cho phép Pod sống sau khi nhận lệnh tắt (15s ngủ + 45s xử lý nốt request = 60s)
      terminationGracePeriodSeconds: 60

      # Khai báo Volume cho CSI
      {{- if .Values.keyvault.enabled }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "microservice.fullname" . }}-akv
      {{- end }}