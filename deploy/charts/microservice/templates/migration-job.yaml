{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "microservice.fullname" . }}-migration
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # --- THÊM MỚI 1: Cấu hình Argo CD Hook để dọn dẹp Job ngay khi chạy xong ---
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300 # Giữ làm fallback an toàn (ArgoCD sẽ xóa trước khi bộ đếm này kích hoạt)
  template:
    metadata:
      name: {{ include "microservice.fullname" . }}-migration
      labels:
        {{- include "microservice.labels" . | nindent 8 }}
        {{- if .Values.keyvault.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "microservice.fullname" . }}
      restartPolicy: Never
      containers:
        - name: db-migration
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.global.imageTag | default .Values.image.tag }}"
          command: ["dotnet", "{{ .Values.migration.dllName }}", "--migrate"]

          # --- THÊM MỚI 2: Khai báo tài nguyên để sửa lỗi HPA <unknown> ---
          resources:
            requests:
              cpu: 50m       # Cấp một lượng nhỏ CPU để HPA có cơ sở tính toán
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

          {{- if .Values.keyvault.enabled }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}

          {{- if or .Values.env .Values.secretEnv .Values.keyvault.enabled }}
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ include "microservice.fullname" . }}-config
            {{- end }}
            {{- if .Values.secretEnv }}
            - secretRef:
                name: {{ include "microservice.fullname" . }}-secret
            {{- end }}
            {{- if .Values.keyvault.enabled }}
            - secretRef:
                name: {{ include "microservice.fullname" . }}-synced-secret
            {{- end }}
          {{- end }}

      {{- if .Values.keyvault.enabled }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "microservice.fullname" . }}-akv
      {{- end }}
{{- end }}