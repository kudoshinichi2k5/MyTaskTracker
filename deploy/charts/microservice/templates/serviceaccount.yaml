# THAY MỚI: Tương tự như trên
{{- $clientId := index .Values.workloadIdentities .Values.fullnameOverride | default "" }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "{{ $clientId }}" # Lấy Client ID từ cấu trúc workloadIdentities dựa vào tên service