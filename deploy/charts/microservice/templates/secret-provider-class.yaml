{{- if .Values.keyvault.enabled }}

# Tạo một ConfigMap chứa TẤT CẢ Client ID của các Backend
resource "kubernetes_config_map" "workload_identity_client_ids" {
  metadata {
    name      = "workload-identity-client-ids"
    namespace = "dev"
  }

  data = {
    # Dùng vòng lặp để đẩy Client ID của từng service vào ConfigMap
    for k, v in module.backend_workload_identities : k => v.client_id
  }

  depends_on = [module.aks]
}

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "microservice.fullname" . }}-akv
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0" # Giữ nguyên wave 0 để tạo trước
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    
    clientID: "{{ $clientId }}"
    
    keyvaultName: "{{ .Values.global.keyvaultName }}"
    tenantId: "{{ .Values.global.tenantId }}"
    # Duyệt qua danh sách các secret cần lấy từ Key Vault
    objects:  |
      array:
        {{- range $kvSecretName, $envVarName := .Values.keyvault.secretsMap }}
        - |
          objectName: "{{ $kvSecretName }}"
          objectType: secret
          objectVersion: ""
        {{- end }}
  # Ánh xạ các secret lấy về thành K8s Secret để bơm vào biến môi trường
  secretObjects:
  - secretName: {{ include "microservice.fullname" . }}-synced-secret
    type: Opaque
    data:
    {{- range $kvSecretName, $envVarName := .Values.keyvault.secretsMap }}
    - key: {{ $envVarName }}
      objectName: "{{ $kvSecretName }}"
    {{- end }}
{{- end }}