apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authservice
  # BẮT BUỘC: Application CRD phải nằm trong namespace của ArgoCD
  namespace: argocd 
spec:
  project: default
  source:
    # URL của repo Git của bạn (Sửa lại cho đúng repo của bạn, ví dụ: https://github.com/kudoshinichi2k5/MyTaskTracker.git)
    repoURL: 'https://github.com/kudoshinichi2k5/MyTaskTracker.git'
    targetRevision: main
    # Đường dẫn trỏ tới chart generic
    path: deploy/charts/microservice
    helm:
      # ArgoCD xử lý path tương đối tính từ thư mục 'path' (microservice)
      valueFiles:
        - ../../values/base/authservice.yaml
        - ../../environments/dev/values.yaml
  destination:
    # Cluster cục bộ nơi ArgoCD đang chạy
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    # Chúng ta dùng Auto Sync luôn cho nhanh!
    automated:
      prune: true     # Xóa resource nếu nó bị xóa trên Git
      selfHeal: true  # Tự động sửa lại nếu ai đó cố tình sửa bằng tay trên K8s (drift)