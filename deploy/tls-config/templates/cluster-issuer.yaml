apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: kienlt.t2.2023@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - dns01:
        azureDNS:
          environment: AzurePublicCloud
          # Các giá trị này sẽ được ArgoCD truyền vào từ file akv-values.yaml
          subscriptionID: {{ .Values.global.subscriptionId }}
          resourceGroupName: {{ .Values.global.dnsResourceGroup }}
          hostedZoneName: {{ .Values.global.dnsZoneName }}
          managedIdentity:
            clientID: {{ .Values.global.certManagerClientId }}