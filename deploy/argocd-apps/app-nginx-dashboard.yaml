
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-dashboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kudoshinichi2k5/MyTaskTracker.git
    targetRevision: main
    path: deploy/observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
