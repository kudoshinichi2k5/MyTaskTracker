apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tracker-valkey
  namespace: argocd
  annotations:
    # Sync Wave -1 đảm bảo Valkey mọc lên TRƯỚC khi AuthService (Wave 2) khởi động
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - chart: valkey
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 6.3.4
      helm:
        valueFiles:
          - $values/deploy/environments/dev/valkey-values.yaml
    - repoURL: 'https://github.com/kudoshinichi2k5/MyTaskTracker.git'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true