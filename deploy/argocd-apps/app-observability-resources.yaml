apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-custom-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kudoshinichi2k5/MyTaskTracker.git'
    targetRevision: main
    path: deploy/observability # Quét toàn bộ thư mục gốc observability
    directory:
      recurse: true # Bắt buộc phải có dòng này để ArgoCD chui vào đọc cả thư mục alerts và dashboards
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true