<div class="forbidden-page">
  <div class="forbidden-card">
    <span class="eyebrow">TaskTracker · Admin</span>
    <h1>This account isn't set up for admin access.</h1>
    <p class="subtitle">
      You're signed in, but your account doesn't have the "admin" role.
      Ask a director or manager to grant it from the AuthService-backed admin panel,
      or head back to the regular TaskTracker app to manage your own tasks.
    </p>
    <button class="sign-out-button" (click)="logout()">Sign out</button>
  </div>
</div>
