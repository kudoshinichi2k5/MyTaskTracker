<div class="login-page">
  <div class="login-card">
    <span class="eyebrow">TaskTracker · Admin</span>
    <h1>Sign in to manage your team.</h1>
    <p class="subtitle">
      Restricted to directors and managers. Access is managed through your
      organization's single sign-on.
    </p>

    <button class="sso-button" (click)="onLogin()">
      Continue with SSO
      <span class="arrow" aria-hidden="true">→</span>
    </button>

    <p class="footnote">Secured by OAuth 2.0 / OpenID Connect</p>
  </div>
</div>
