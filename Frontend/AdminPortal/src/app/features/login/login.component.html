<section class="login-page" style="max-width: 420px; margin: 80px auto; padding: 24px; border: 1px solid #d0d7de; border-radius: 12px; background: white;">
  <h2>Admin Sign in</h2>

  <form (ngSubmit)="onLogin()" #loginForm="ngForm">
    <div style="margin-bottom: 16px;">
      <label for="username">Username</label>
      <input id="username" name="username" [(ngModel)]="username" type="text" required style="width: 100%; padding: 10px; margin-top: 8px;" />
    </div>

    <div style="margin-bottom: 16px;">
      <label for="password">Password</label>
      <input id="password" name="password" [(ngModel)]="password" type="password" required style="width: 100%; padding: 10px; margin-top: 8px;" />
    </div>

    <button type="submit" [disabled]="isSubmitting || !loginForm.valid" style="width: 100%; padding: 10px; cursor: pointer;">
      {{ isSubmitting ? 'Signing in...' : 'Login' }}
    </button>

    <p *ngIf="errorMessage" style="color: #b42318; margin-top: 12px;">{{ errorMessage }}</p>
  </form>
</section>
