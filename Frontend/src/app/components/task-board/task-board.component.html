<div class="board-page">
  <header class="board-header">
    <div>
      <span class="eyebrow">TaskTracker</span>
      <h1>My tasks</h1>
    </div>
    <div class="header-actions">
      <app-notification-bell></app-notification-bell>
      <button class="logout-button" (click)="logout()">Sign out</button>
    </div>
  </header>

  <form class="add-task-form" (ngSubmit)="addTask()">
    <input
      type="text"
      name="newTaskTitle"
      placeholder="Add a task…"
      maxlength="200"
      [(ngModel)]="newTaskTitle"
      [disabled]="isAdding"
    />
    <button type="submit" [disabled]="isAdding || !newTaskTitle.trim()">Add</button>
  </form>

  <div class="progress-block" *ngIf="tasks.length > 0">
    <div class="progress-meta">
      <span>{{ completedCount }} of {{ tasks.length }} done</span>
      <span class="progress-count">{{ progressPercent }}%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" [style.width.%]="progressPercent"></div>
    </div>
  </div>

  <p class="error-banner" *ngIf="loadError">
    Couldn't load your tasks. Please refresh the page or try again later.
  </p>

  <ul class="task-list skeleton-list" *ngIf="isLoading">
    <li class="task-row skeleton-row" *ngFor="let n of [1, 2, 3]">
      <span class="skeleton-checkbox"></span>
      <span class="skeleton-line"></span>
    </li>
  </ul>

  <ul class="task-list" *ngIf="!loadError && !isLoading">
    <li class="task-row" *ngFor="let task of tasks; trackBy: trackByTaskId">
      <label *ngIf="editingTaskId !== task.id; else editing">
        <input type="checkbox" [checked]="task.isCompleted" (change)="toggleTask(task)" />
        <span
          class="task-title"
          [class.done]="task.isCompleted"
          (dblclick)="startEdit(task)"
        >{{ task.title }}</span>
      </label>

      <ng-template #editing>
        <input
          #editInput
          type="text"
          class="edit-input"
          maxlength="200"
          autofocus
          [(ngModel)]="editingTitle"
          [ngModelOptions]="{ standalone: true }"
          (keydown.enter)="saveEdit(task)"
          (keydown.escape)="cancelEdit()"
          (blur)="saveEdit(task)"
        />
      </ng-template>

      <div class="task-actions">
        <button
          class="edit-button"
          *ngIf="editingTaskId !== task.id"
          (click)="startEdit(task)"
          aria-label="Rename task"
        >
          &#9998;
        </button>
        <button class="delete-button" (click)="removeTask(task)" aria-label="Delete task">
          &#10005;
        </button>
      </div>
    </li>
  </ul>

  <p class="empty-state" *ngIf="!loadError && !isLoading && tasks.length === 0">
    No tasks yet. Enjoy the quiet.
  </p>
</div>
