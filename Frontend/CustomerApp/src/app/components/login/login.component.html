<div class="login-page">
  <div class="login-card">
    <span class="eyebrow">TaskTracker</span>
    <h1>Sign in to see what's next.</h1>
    <p class="subtitle">
      Access is managed through your organization's single sign-on.
      No separate password to remember.
    </p>

    <button class="sso-button" (click)="onLogin()">
      Continue with SSO
      <span class="arrow" aria-hidden="true">→</span>
    </button>

    <p class="footnote">Secured by OAuth 2.0 / OpenID Connect</p>
  </div>
</div>
