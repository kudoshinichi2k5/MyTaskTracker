<div class="bell-wrapper">
  <button
    class="bell-button"
    (click)="toggle()"
    (keydown.escape)="close()"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="true"
    aria-label="Notifications"
  >
    <svg class="bell-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M12 3a6 6 0 0 0-6 6c0 3.5-.9 5.3-1.8 6.4-.4.5 0 1.1.6 1.1h14.4c.6 0 1-.6.6-1.1-.9-1.1-1.8-2.9-1.8-6.4a6 6 0 0 0-6-6Z"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
      <path d="M9.5 18.5a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
    <span class="bell-badge" *ngIf="unreadCount > 0">{{ badgeText }}</span>
  </button>

  <div class="bell-dropdown" *ngIf="isOpen" role="menu">
    <p class="dropdown-title">Notifications</p>

    <ul *ngIf="notifications.length > 0; else empty">
      <li
        *ngFor="let n of notifications; trackBy: trackById"
        class="notification-row"
        [class.unread]="!n.isRead"
        (click)="markAsRead(n)"
      >
        {{ n.message }}
      </li>
    </ul>

    <ng-template #empty>
      <p class="dropdown-empty">You're all caught up.</p>
    </ng-template>
  </div>
</div>
