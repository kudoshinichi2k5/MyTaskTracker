<section class="login-page">
  <div class="login-card">
    <h2>Sign in</h2>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-field">
        <label for="username">Username</label>
        <input id="username" name="username" [(ngModel)]="username" type="text" required />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" name="password" [(ngModel)]="password" type="password" required />
      </div>

      <button class="submit-button" type="submit" [disabled]="isSubmitting || !loginForm.valid">
        {{ isSubmitting ? 'Signing in...' : 'Login' }}
      </button>

      <p class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
  </div>
</section>
