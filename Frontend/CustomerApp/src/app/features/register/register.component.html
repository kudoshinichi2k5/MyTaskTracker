<section class="login-page">
  <div class="login-card">
    <h2>Create your account</h2>

    <form (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-field">
        <label for="username">Username</label>
        <input id="username" name="username" [(ngModel)]="username" type="text" minlength="3" required />
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" [(ngModel)]="email" type="email" required />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" name="password" [(ngModel)]="password" type="password" minlength="6" required />
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" type="password" required />
      </div>

      <button class="submit-button" type="submit" [disabled]="isSubmitting || !registerForm.valid">
        {{ isSubmitting ? 'Creating account...' : 'Create account' }}
      </button>

      <p class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="switch-link">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</section>
