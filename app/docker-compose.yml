services:
  mariadb:
    image: mariadb:11.4
    container_name: tracker-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in app/.env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in app/.env}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD:?Set TASK_DB_PASSWORD in app/.env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in app/.env}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:?Set PROJECT_DB_PASSWORD in app/.env}
      COMMENT_DB_PASSWORD: ${COMMENT_DB_PASSWORD:?Set COMMENT_DB_PASSWORD in app/.env}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6

  valkey:
    image: valkey/valkey:8-alpine
    container_name: tracker-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  auth-migrate:
    build:
      context: ./Backend/Tracker.AuthService
      target: runtime
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Valkey: "valkey:6379"
      ConnectionStrings__AuthDb: "Server=mariadb;Port=3306;Database=tracker_auth;User=auth_service;Password=${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in app/.env};"

  auth-service:
    build:
      context: ./Backend/Tracker.AuthService
      target: runtime
    container_name: tracker-auth-service
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Valkey: "valkey:6379"
      ConnectionStrings__AuthDb: "Server=mariadb;Port=3306;Database=tracker_auth;User=auth_service;Password=${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in app/.env};"
      AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"
    ports:
      - "5001:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  task-migrate:
    build:
      context: ./Backend/Tracker.TaskService
      target: runtime
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TaskDb: "Server=mariadb;Port=3306;Database=tracker_tasks;User=task_service;Password=${TASK_DB_PASSWORD:?Set TASK_DB_PASSWORD in app/.env};"

  task-service:
    build:
      context: ./Backend/Tracker.TaskService
      target: runtime
    container_name: tracker-task-service
    depends_on:
      mariadb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      task-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TaskDb: "Server=mariadb;Port=3306;Database=tracker_tasks;User=task_service;Password=${TASK_DB_PASSWORD:?Set TASK_DB_PASSWORD in app/.env};"
      AuthService__BaseUrl: "http://auth-service:8080"
      AuthService__VerifyPath: "/verify"
      AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"
    ports:
      - "5002:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  notification-migrate:
    build:
      context: ./Backend/Tracker.NotificationService
      target: runtime
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: "Server=mariadb;Port=3306;Database=tracker_notifications;User=notification_service;Password=${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in app/.env};"

  notification-service:
    build:
      context: ./Backend/Tracker.NotificationService
      target: runtime
    container_name: tracker-notification-service
    depends_on:
      mariadb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NotificationDb: "Server=mariadb;Port=3306;Database=tracker_notifications;User=notification_service;Password=${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in app/.env};"
      AuthService__BaseUrl: "http://auth-service:8080"
      AuthService__VerifyPath: "/verify"
      AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"
    ports:
      - "5003:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  project-migrate:
    build:
      context: ./Backend/Tracker.ProjectService
      target: runtime
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProjectDb: "Server=mariadb;Port=3306;Database=tracker_projects;User=project_service;Password=${PROJECT_DB_PASSWORD:?Set PROJECT_DB_PASSWORD in app/.env};"

  project-service:
    build:
      context: ./Backend/Tracker.ProjectService
      target: runtime
    container_name: tracker-project-service
    depends_on:
      mariadb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      project-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ProjectDb: "Server=mariadb;Port=3306;Database=tracker_projects;User=project_service;Password=${PROJECT_DB_PASSWORD:?Set PROJECT_DB_PASSWORD in app/.env};"
      AuthService__BaseUrl: "http://auth-service:8080"
      AuthService__VerifyPath: "/verify"
      AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"
    ports:
      - "5004:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  comment-migrate:
    build:
      context: ./Backend/Tracker.CommentService
      target: runtime
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CommentDb: "Server=mariadb;Port=3306;Database=tracker_comments;User=comment_service;Password=${COMMENT_DB_PASSWORD:?Set COMMENT_DB_PASSWORD in app/.env};"

  comment-service:
    build:
      context: ./Backend/Tracker.CommentService
      target: runtime
    container_name: tracker-comment-service
    depends_on:
      mariadb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      comment-migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CommentDb: "Server=mariadb;Port=3306;Database=tracker_comments;User=comment_service;Password=${COMMENT_DB_PASSWORD:?Set COMMENT_DB_PASSWORD in app/.env};"
      AuthService__BaseUrl: "http://auth-service:8080"
      AuthService__VerifyPath: "/verify"
      AllowedFrontendOrigins: "http://localhost:4200,http://localhost:4300"
    ports:
      - "5005:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  customer-app:
    build:
      context: ./Frontend/CustomerApp
      target: runtime
      args:
        CONFIGURATION: development
        BASE_HREF: /
    container_name: tracker-customer-app
    depends_on:
      - auth-service
      - task-service
      - notification-service
      - project-service
      - comment-service
    ports:
      - "4200:8080"

  admin-portal:
    build:
      context: ./Frontend/AdminPortal
      target: runtime
      args:
        CONFIGURATION: development
        BASE_HREF: /
    container_name: tracker-admin-portal
    depends_on:
      - auth-service
      - task-service
      - notification-service
      - project-service
      - comment-service
    ports:
      - "4300:8080"

volumes:
  mariadb_data:
  valkey_data:
