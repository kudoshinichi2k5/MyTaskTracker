<!-- Users Page - Modern UI with Consistent Design System -->
<div class="p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Page Header -->
    <header class="mb-8">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-3xl font-bold text-ink mb-2">Users</h1>
          <p class="text-muted text-sm">Manage user accounts and permissions</p>
        </div>
        <div class="flex items-center gap-3">
          <button class="btn btn-secondary">Invite User</button>
        </div>
      </div>
      
      <!-- Filter and Search Bar -->
      <div class="bg-white rounded-lg p-4 shadow-sm border border-line flex flex-col sm:flex-row gap-3">
        <div class="flex-1">
          <input type="text" class="input input-bordered w-full" placeholder="Search users...">
        </div>
        <div class="flex items-center gap-2">
          <select class="select select-bordered">
            <option>All Roles</option>
            <option>Admin</option>
            <option>Editor</option>
            <option>Viewer</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-muted">Status:</span>
          <select class="select select-sm">
            <option>All</option>
            <option>Active</option>
            <option>Invited</option>
            <option>Suspended</option>
          </select>
        </div>
      </div>
    </header>
    
    <!-- Users Table -->
    <section class="overflow-x-auto">
      <div class="bg-white rounded-lg p-4 shadow-sm border border-line">
        <div class="flex flex-col sm:flex-row gap-4 mb-4">
          <h2 class="text-sm font-semibold text-muted">Users List</h2>
          <div class="flex items-center gap-2">
            <select class="select select-sm">
              <option>10</option>
              <option>25</option>
              <option>50</option>
              <option>100</option>
            </select>
            <span class="text-xs text-muted">per page</span>
          </div>
        </div>
        
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="border-b border-line">
                <th class="text-left text-sm font-medium text-muted-whitespace py-3 whitespace-nowrap">Username</th>
                <th class="text-left text-sm font-medium text-muted-whitespace py-3 whitespace-nowrap">Full Name</th>
                <th class="text-left text-sm font-medium text-muted-whitespace py-3 whitespace-nowrap">Email</th>
                <th class="text-left text-sm font-medium text-muted-whitespace py-3 whitespace-nowrap">Role</th>
                <th class="text-left text-sm font-medium text-muted-whitespace py-3 whitespace-nowrap">Status</th>
                <th class="text-right text-sm font-medium text-muted-whitespace py-3 whitespace-nowrap">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- User Row -->
              <tr *ngFor="let user of users" class="border-b border-line last:border-0 hover:bg-surface-soft transition-colors">
                <td class="text-sm font-medium py-4 whitespace-nowrap">
                  <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-md flex items-center justify-center flex-shrink-0" style="background: var(--color-accent-soft); color: var(--color-accent-text);">{{ user.initials }}</div>
                    <span>{{ user.username }}</span>
                  </div>
                </td>
                <td class="text-sm py-4 whitespace-nowrap">{{ user.fullName }}</td>
                <td class="text-sm py-4 whitespace-nowrap">{{ user.email }}</td>
                <td class="text-sm py-4 whitespace-nowrap">
                  <span class="px-2 py-1 rounded text-xs font-medium" style="color: var(--color-ink);">{{ user.role }}</span>
                </td>
                <td class="text-sm py-4 whitespace-nowrap">
                  <span class="px-2 py-1 rounded text-xs font-medium" style="color: var(--color-success);">Active</span>
                </td>
                <td class="text-right py-4 whitespace-nowrap">
                  <div class="flex gap-1">
                    <button class="icon-btn rounded-md p-1 hover:bg-surface-soft hover:transition-colors" title="Edit">
                      <svg class="w-4 h-4 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a1 1 0 0 1 1.4.9l1.83 5.32a1 1 0 0 1-.3 1.2l-2.06-2.06a1 1 0 0 1-.5-.8V3.9a1 1 0 0 1 1.4-.8z"/>
                        <path d="M14 2l-4 4 4 4"/>
                      </svg>
                    </button>
                    <button class="icon-btn rounded-md p-1 hover:bg-surface-soft hover:transition-colors" title="Delete">
                      <svg class="w-4 h-4 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                        <line x1="7" y1="6" x2="14" y2="6"/>
                        <line x1="7" y1="12" x2="14" y2="12"/>
                        <line x1="7" y1="18" x2="14" y2="18"/>
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</div>
