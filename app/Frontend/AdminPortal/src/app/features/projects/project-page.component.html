<!-- Project Page - Modern UI with Consistent Design System -->
<div class="p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Page Header -->
    <header class="mb-8">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-3xl font-bold text-ink mb-2">Projects</h1>
          <p class="text-muted text-sm">Manage your project collaborations</p>
        </div>
        <div class="flex items-center gap-3">
          <button class="btn btn-primary">New Project</button>
        </div>
      </div>
      
      <!-- Filter and Search Bar -->
      <div class="bg-white rounded-lg p-4 shadow-sm border border-line flex flex-col sm:flex-row gap-3">
        <div class="flex-1">
          <input type="text" class="input input-bordered w-full" placeholder="Search projects...">
        </div>
        <div class="flex items-center gap-2">
          <select class="select select-bordered">
            <option>All Statuses</option>
            <option>Active</option>
            <option>On Hold</option>
            <option>Archived</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-muted">View:</span>
          <select class="select select-sm">
            <option>Grid</option>
            <option>List</option>
          </select>
        </div>
      </div>
    </header>
    
    <!-- Projects Grid -->
    <section class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <!-- Project Card -->
      <div *ngFor="let project of projects" class="project-card bg-white rounded-2xl p-6 shadow-sm border border-line hover:transition-all duration-300 hover:shadow-lg max-h-64 flex flex-col">
        <div class="flex items-start gap-3 mb-4">
          <div class="w-10 h-10 rounded-md flex items-center justify-center flex-shrink-0" style="background: var(--color-accent-soft); color: var(--color-accent-text);">
            <p class="text-sm font-medium" style="line-height: 1;">{{ project.initials }}</p>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-lg font-semibold text-ink">{{ project.name }}</h3>
            <p class="text-sm text-muted-soft line-clamp-2">{{ project.description }}</p>
          </div>
        </div>
        
        <div class="mt-auto flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-sm font-medium">{{ project.owner }}</span>
            <small class="text-xs text-muted-soft">• {{ project.members }} members</small>
          </div>
          <div class="flex items-center gap-1">
            <span class="text-xs font-medium" style="color: var(--color-success);">Active</span>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
