<section class="login-page">
  <div class="login-card">
    <h2 class="text-2xl font-bold text-ink block mb-6">Sign in</h2>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="tt-field">
        <label class="tt-label" for="username">Username</label>
        <input
          id="username"
          name="username"
          [(ngModel)]="username"
          type="text"
          required
          class="tt-input"
        />
      </div>

      <div class="tt-field">
        <label class="tt-label" for="password">Password</label>
        <input
          id="password"
          name="password"
          [(ngModel)]="password"
          type="password"
          required
          class="tt-input"
        />
      </div>

      <button
        class="tt-btn tt-btn--primary"
        type="submit"
        [disabled]="isSubmitting || !loginForm.valid"
      >
        {{ isSubmitting ? 'Signing in...' : 'Login' }}
      </button>

      <p class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="switch-link">
      Don't have an account? <a routerLink="/register">Create one</a>
    </p>
  </div>
</section>
