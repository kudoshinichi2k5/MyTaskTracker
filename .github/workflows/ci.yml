name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build & push tất cả service, bỏ qua kiểm tra thay đổi'
        type: boolean
        default: false

# BẮT BUỘC: Khai báo quyền để GitHub Actions có thể xin token OIDC
permissions:
  id-token: write 
  contents: read  

jobs:
  # Job 1: Quét thay đổi file
  changes:
    runs-on: ubuntu-latest
    # Cần khai báo outputs để job khác đọc được
    outputs:
      # Tách thành 2 output riêng biệt
      changed_backend: ${{ steps.final.outputs.backend }}
      changed_frontend: ${{ steps.final.outputs.frontend }}
      # Mảng đã hợp nhất backend+frontend, tính sẵn bằng jq ở step "final"
      # bên dưới - để job 4 không phải tự ghép chuỗi JSON bằng
      # format()+join() nữa (join() không quote lại string -> sinh JSON hỏng).
      changed_all: ${{ steps.final.outputs.all }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # dorny/paths-filter cần lịch sử git để diff với commit trước đó
          # khi event là "push". fetch-depth mặc định = 1 (chỉ 1 commit)
          # khiến nó không có gì để so sánh -> fetch toàn bộ lịch sử.
          fetch-depth: 0

      - name: Check for Backend changes
        # action dorny sẽ sinh ra một output dạng mảng JSON chứa các filter có thay đổi, vd: '["Auth", "Task"]'
        uses: dorny/paths-filter@v3
        id: filter-backend
        with:
          filters: |
            AuthService: 'app/Backend/Tracker.AuthService/**'
            TaskService: 'app/Backend/Tracker.TaskService/**'
            NotificationService: 'app/Backend/Tracker.NotificationService/**'
            ProjectService: 'app/Backend/Tracker.ProjectService/**'
            CommentService: 'app/Backend/Tracker.CommentService/**'

      - name: Check for Frontend changes
        uses: dorny/paths-filter@v3
        id: filter-frontend
        with:
          filters: |
            CustomerApp: 'app/Frontend/CustomerApp/**'
            AdminPortal: 'app/Frontend/AdminPortal/**'

      # ĐÂY mới là nơi duy nhất build_all được phép có tác dụng: override
      # ngay tại NGUỒN dữ liệu (output của job này), chứ không phải ở điều
      # kiện "if" của job build-and-push-docker. Mọi job phía sau chỉ đọc
      # changed_backend/changed_frontend/changed_all và không cần biết
      # build_all tồn tại.
      - name: Resolve final changed-service lists
        id: final
        run: |
          if [[ "${{ github.event.inputs.build_all }}" == "true" ]]; then
            # build_all bật -> bỏ qua kết quả diff, coi như mọi service đổi
            BACKEND='["AuthService","TaskService","NotificationService","ProjectService","CommentService"]'
            FRONTEND='["CustomerApp","AdminPortal"]'
          else
            # Khai báo biến trung gian
            BACKEND='${{ steps.filter-backend.outputs.changes }}'
            FRONTEND='${{ steps.filter-frontend.outputs.changes }}'
          fi

          # Hợp nhất 2 mảng JSON bằng jq (có sẵn trên ubuntu-latest) thay vì
          # format()+join() của GitHub Actions expression, vì join() chỉ nối
          # chuỗi thô, không quote lại string -> sinh ra JSON không hợp lệ.
          ALL=$(jq -c -n --argjson a "$BACKEND" --argjson b "$FRONTEND" '$a + $b')

          # Ghi vào GITHUB_OUTPUT bằng heredoc
          cat << EOF >> "$GITHUB_OUTPUT"
          backend=$BACKEND
          frontend=$FRONTEND
          all=$ALL
          EOF

  # Job 2: Build & Test backend (Chỉ chạy nếu có thay đổi Backend)
  build-backend:
    needs: [changes] # Phải đợi check thay đổi 
    if: needs.changes.outputs.changed_backend != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.changed_backend) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # THÊM MỚI: Cache NuGet
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('app/Backend/Tracker.{0}/*.csproj', matrix.service), format('app/Backend/Tests/Tracker.{0}.Tests/*.csproj', matrix.service)) }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.service }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        # Dùng biến matrix để thay đổi động đường dẫn thư mục
        run: dotnet restore app/Backend/Tests/Tracker.${{ matrix.service }}.Tests

      - name: Build
        run: dotnet build app/Backend/Tests/Tracker.${{ matrix.service }}.Tests --no-restore

      # 1. Chạy test và ép xuất ra report (TRX và Cobertura)
      - name: Test and Collect Coverage
        run: |
          dotnet test app/Backend/Tests/Tracker.${{ matrix.service }}.Tests \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test_results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      # 2. Upload Artifact: Test Results (.trx)
      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        # Đặt điều kiện: Upload cả khi test fail (nếu không, test fail job sẽ dừng và không có report để xem)
        if: always() 
        with:
          # Đặt tên artifact phụ thuộc vào biến matrix để tránh ghi đè
          name: TestReport-${{ matrix.service }}
          # Dùng đường dẫn tuyệt đối để đảm bảo tìm đúng
          path: ${{ github.workspace }}/TestResults/test_results.trx
          # Tránh lỗi khi project chưa có Unit Test
          if-no-files-found: warn

      # 3. Upload Artifact: Code Coverage (xml)
      - name: Upload Code Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CodeCoverage-${{ matrix.service }}
          # Coverlet sinh file coverage trong 1 thư mục random GUID, ta dùng wildcard (**) để tìm
          path: ${{ github.workspace }}/TestResults/**/coverage.cobertura.xml
          # Tránh lỗi khi project chưa có Unit Test
          if-no-files-found: warn

  # Job 3: Build & Test frontend (Chỉ chạy nếu có thay đổi Frontend)
  build-frontend:
    needs: [changes]
    # Chỉ chạy nếu có thay đổi Frontend
    if: needs.changes.outputs.changed_frontend != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.changes.outputs.changed_frontend) }}
    
    # Thiết lập thư mục gốc mặc định cho toàn bộ job này
    defaults:
      run:
        working-directory: app/Frontend/${{ matrix.app }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # SỬA LẠI: Tận dụng tính năng cache tích hợp của setup-node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          # Truyền đường dẫn tĩnh (động theo matrix) để setup-node tự tính hash code
          cache-dependency-path: app/Frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies (Clean install)
        run: npm ci

      # Chạy build với cấu hình testing như thống nhất
      - name: Build (Testing Environment)
        run: npm run build:testing

      # Chạy Jest Test (Tự động Headless nhờ JSDOM)
      - name: Test
        run: npm run test

      # (Optional) Bạn có thể tự thêm phần upload Artifact cho dist/ folder và coverage nếu muốn giống Backend

  # Job 4: Build và Push Docker Image
  build-and-push-docker:
    # Phải đợi build và test pass.
    needs: [changes, build-backend, build-frontend]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.changed_all != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # changed_all đã là 1 mảng JSON hợp lệ được hợp nhất sẵn (bằng jq)
        # ở job "changes" - không còn tự ghép bằng format()+join() ở đây nữa.
        service: ${{ fromJson(needs.changes.outputs.changed_all) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Xác thực với Azure (OIDC)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Login ACR bằng biến động thay vì hardcode
      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      # 3. Chuẩn bị đường dẫn thư mục, tên image và Build Args
      - name: Set Image Path, Name and Build Args
        id: prep
        run: |
          SERVICE_LOWER=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          
          if [[ "${{ matrix.service }}" == *"App"* ]] || [[ "${{ matrix.service }}" == *"Portal"* ]]; then
            CONTEXT_PATH="app/Frontend/${{ matrix.service }}"
            IMAGE_NAME="${{ vars.ACR_NAME }}.azurecr.io/frontend/$SERVICE_LOWER"
            # Frontend dùng ARG CONFIGURATION (testing cho CI, hoặc production tùy chiến lược)
            BUILD_ARGS="CONFIGURATION=testing\nBASE_HREF=/"
          else
            CONTEXT_PATH="app/Backend/Tracker.${{ matrix.service }}"
            IMAGE_NAME="${{ vars.ACR_NAME }}.azurecr.io/backend/$SERVICE_LOWER"
            # Backend bắt buộc cần ARG SERVICE_NAME
            BUILD_ARGS="SERVICE_NAME=Tracker.${{ matrix.service }}"
          fi
          
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "CONTEXT_PATH=$CONTEXT_PATH" >> $GITHUB_ENV
          
          # Lưu BUILD_ARGS dưới dạng multiline string vào GITHUB_ENV
          echo "BUILD_ARGS<<EOF" >> $GITHUB_ENV
          echo -e "$BUILD_ARGS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 4. Build và Push sử dụng docker/build-push-action
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT_PATH }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: ${{ env.BUILD_ARGS }}
          # Kích hoạt Docker Cache, dùng tên dịch vụ lấy từ matrix làm Scope để không đụng nhau
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}