name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# BẮT BUỘC: Khai báo quyền để GitHub Actions có thể xin token OIDC
permissions:
  id-token: write 
  contents: read  

jobs:
  setup-and-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Test Azure CLI
        run: az account show