name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# BẮT BUỘC: Khai báo quyền để GitHub Actions có thể xin token OIDC
permissions:
  id-token: write 
  contents: read  

jobs:
  # Job 1: Quét thay đổi file
  changes:
    runs-on: ubuntu-latest
    # Cần khai báo outputs để job khác đọc được
    outputs:
      # action dorny sẽ sinh ra một output dạng mảng JSON chứa các filter có thay đổi, vd: '["Auth", "Task"]'
      changed_services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            AuthService: 'app/Backend/Tracker.AuthService/**'
            TaskService: 'app/Backend/Tracker.TaskService/**'
            NotificationService: 'app/Backend/Tracker.NotificationService/**'
            ProjectService: 'app/Backend/Tracker.ProjectService/**'
            CommentService: 'app/Backend/Tracker.CommentService/**'

  # Job 2: Build & Test
  build-backend:
    needs: [changes] # Phải đợi check thay đổi 
    if: needs.changes.outputs.changed_services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.changed_services) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        # Dùng biến matrix để thay đổi động đường dẫn thư mục
        run: dotnet restore app/Backend/Tracker.${{ matrix.service }}

      - name: Build
        run: dotnet build app/Backend/Tracker.${{ matrix.service }} --no-restore

      - name: Test
        run: dotnet test app/Backend/Tracker.${{ matrix.service }} --no-build --verbosity normal

  # Job 3: Login Azure (Chỉ chuẩn bị sẵn cho Day 4)
  # Đặt điều kiện: Chỉ chạy nếu sự kiện không phải là pull_request (tức là push vào main)
  setup-and-login:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Test Azure CLI
        run: az account show