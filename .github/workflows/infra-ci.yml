name: Infrastructure CI/CD

# THÊM KHỐI CONCURRENCY NÀY
# Đảm bảo chỉ có 1 workflow Infra được chạy tại 1 thời điểm. Các luồng sau phải xếp hàng chờ.
concurrency:
  group: terraform-infra
  cancel-in-progress: false # KHÔNG ĐƯỢC để true, vì hủy ngang lúc đang apply là thảm họa làm kẹt state!

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Chọn hành động cho WORKLOADS'
        required: true
        default: 'apply'
        type: choice
        options: [ apply, destroy ]

permissions:
  id-token: write
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      persistent: ${{ steps.filter.outputs.persistent }}
      workloads: ${{ steps.filter.outputs.workloads }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            persistent: 'infrastructure/environments/dev/persistent/**'
            workloads: 'infrastructure/environments/dev/workloads/**'

  persistent:
    needs: changes
    if: needs.changes.outputs.persistent == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/environments/dev/persistent
    env:
      TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - run: terraform validate
      - run: terraform plan -no-color
        if: github.event_name == 'pull_request'
      - run: terraform apply -auto-approve
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  workloads:
    needs: [changes, persistent]
    if: |
      always() && 
      (needs.changes.outputs.workloads == 'true' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/environments/dev/workloads
    env:
      TF_VAR_arm_client_id: ${{ secrets.AZURE_TF_CLIENT_ID }}
      TF_VAR_arm_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_arm_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - run: terraform validate
      
      - name: Terraform Plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform plan -no-color

      - name: Terraform Apply (Phase 1 - AKS)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -target=module.aks -auto-approve

      - name: Terraform Apply (Phase 2 - Full)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve

      # --- BACKUP GATE TRƯỚC KHI DESTROY ---
      - name: Get AKS Credentials
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          # Lấy thông tin kết nối K8s để chạy lệnh kubectl
          az aks get-credentials --resource-group rg-tasktracker-dev --name aks-tasktracker-dev --overwrite-existing

      - name: Trigger and Wait for Backup Job
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          echo "Bắt đầu tạo Job Backup thủ công từ CronJob..."
          JOB_NAME="manual-backup-before-destroy-$(date +%s)"
          
          # Tạo Job từ CronJob hiện có
          kubectl create job --from=cronjob/tracker-db-backup $JOB_NAME -n dev
          
          echo "Đang chờ Job backup hoàn thành (Timeout: 10 phút)..."
          # Lệnh wait này sẽ chặn CI lại cho đến khi Job báo 'Complete'
          if kubectl wait --for=condition=complete job/$JOB_NAME -n dev --timeout=600s; then
            echo "✅ Backup hoàn tất thành công. Cho phép tiến hành Destroy!"
          else
            echo "❌ Lỗi: Job backup thất bại hoặc quá thời gian. HỦY BỎ QUÁ TRÌNH DESTROY để bảo toàn dữ liệu!"
            # Hiển thị log để debug
            kubectl logs -l job-name=$JOB_NAME -n dev
            exit 1 # Báo lỗi cho GitHub Actions để dừng luồng
          fi
      
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Update ArgoCD AKV Values
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          terraform output -json > tf_outputs.json
          KV_NAME=$(jq -r '.keyvault_name.value' tf_outputs.json)
          TENANT_ID=$(jq -r '.tenant_id.value' tf_outputs.json)
          BACKUP_CLIENT_ID=$(jq -r '.backup_client_id.value' tf_outputs.json)
          BACKUP_SA_NAME=$(jq -r '.backup_storage_account_name.value' tf_outputs.json)
          cd ../../../../
          cat <<EOF > deploy/environments/dev/akv-values.yaml
          global:
            keyvaultName: "$KV_NAME"
            tenantId: "$TENANT_ID"
            backupClientId: "$BACKUP_CLIENT_ID"
            backupStorageAccount: "$BACKUP_SA_NAME"
          EOF
          echo "keyvault_clients:" >> deploy/environments/dev/akv-values.yaml
          jq -r '.backend_client_ids.value | to_entries | .[] | "  \(.key): \(.value)"' infrastructure/environments/dev/workloads/tf_outputs.json >> deploy/environments/dev/akv-values.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/environments/dev/akv-values.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(infra): sync terraform outputs to argocd values [skip ci]" && git push)