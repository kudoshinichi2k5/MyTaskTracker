name: Infrastructure CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Chọn hành động cho WORKLOADS'
        required: true
        default: 'apply'
        type: choice
        options: [ apply, apply-workloads-plan, destroy ]
      plan_run_id:
        description: 'Run ID of the post-merge workloads plan (for apply-workloads-plan)'
        required: false
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      persistent: ${{ steps.filter.outputs.persistent }}
      workloads: ${{ steps.filter.outputs.workloads }}
      combined: ${{ steps.filter.outputs.persistent == 'true' && steps.filter.outputs.workloads == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            persistent:
              - 'infrastructure/environments/dev/persistent/**'
              - 'infrastructure/modules/**'
            workloads:
              - 'infrastructure/environments/dev/workloads/**'
              - 'infrastructure/modules/**'

  persistent:
    needs: changes
    if: needs.changes.outputs.persistent == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-dev-persistent
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infrastructure/environments/dev/persistent
    env:
      TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkov - persistent
        id: checkov
        if: github.event_name == 'pull_request'
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12
        with:
          directory: infrastructure/environments/dev/persistent
          framework: terraform
          baseline: infrastructure/environments/dev/persistent/.checkov.baseline
          soft_fail: false
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - run: terraform validate
      - run: terraform plan -input=false -no-color
        if: github.event_name == 'pull_request'
      - run: terraform apply -input=false -auto-approve
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  workloads:
    needs: [changes, persistent]
    if: |
      always() && 
      (needs.changes.outputs.workloads == 'true' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.action == 'apply' ||
         github.event.inputs.action == 'apply-workloads-plan' ||
         github.event.inputs.action == 'destroy'))) &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-dev-workloads
      cancel-in-progress: false
    outputs:
      deferred: ${{ steps.defer.outputs.deferred }}
      advisory_result: ${{ steps.terraform-plan.outcome }}
    defaults:
      run:
        working-directory: infrastructure/environments/dev/workloads
    env:
      TF_VAR_arm_client_id: ${{ secrets.AZURE_TF_CLIENT_ID }}
      TF_VAR_arm_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_arm_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      - name: Checkov - workloads
        id: checkov
        if: github.event_name == 'pull_request'
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12
        with:
          directory: infrastructure/environments/dev/workloads
          framework: terraform
          baseline: infrastructure/environments/dev/workloads/.checkov.baseline
          soft_fail: false
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_TF_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - run: terraform validate
      
      - name: Terraform Plan
        id: terraform-plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        continue-on-error: ${{ github.event_name == 'pull_request' && needs.changes.outputs.combined == 'true' }}
        run: terraform plan -input=false -no-color

      - name: Mark workloads plan as deferred
        id: defer
        if: github.event_name == 'pull_request' && needs.changes.outputs.combined == 'true'
        env:
          ADVISORY_RESULT: ${{ steps.terraform-plan.outcome }}
        run: |
          echo "deferred=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Workloads plan deferred"
            echo "Best-effort plan result: ${ADVISORY_RESULT}."
            echo "This combined-stack PR ran a best-effort plan only. It is not eligible for apply because persistent remote-state outputs are not updated until persistent is applied."
            echo "After merge, persistent applies first; workloads is planned again from main and requires a manual workflow_dispatch using the new plan run ID."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create fresh post-merge workloads plan
        if: github.event_name == 'push' && needs.changes.outputs.combined == 'true'
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out=tfplan
          root_tree="$(git rev-parse HEAD:infrastructure/environments/dev/workloads)"
          modules_tree="$(git rev-parse HEAD:infrastructure/modules)"
          jq -n \
            --arg source_sha "$(git rev-parse HEAD)" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg root_tree "$root_tree" \
            --arg modules_tree "$modules_tree" \
            '{source_sha:$source_sha, run_id:$run_id, root_tree:$root_tree, modules_tree:$modules_tree}' \
            > plan-metadata.json
          prefix="plans/dev/post-merge/${GITHUB_RUN_ID}"
          az storage blob upload \
            --auth-mode login \
            --account-name tfstate4459 \
            --container-name tfstate \
            --name "${prefix}/workloads.tfplan" \
            --file tfplan \
            --overwrite true \
            --only-show-errors \
            --output none
          az storage blob upload \
            --auth-mode login \
            --account-name tfstate4459 \
            --container-name tfstate \
            --name "${prefix}/workloads.json" \
            --file plan-metadata.json \
            --overwrite true \
            --only-show-errors \
            --output none
          {
            echo "### Workloads plan ready for review"
            echo "Persistent applied first. Review this run's plan, then dispatch Infrastructure CI/CD on main with action \`apply-workloads-plan\` and run ID \`${GITHUB_RUN_ID}\`."
            echo "This is a fresh plan from main; the PR workloads plan will never be applied."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply (Phase 1 - AKS)
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.combined != 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
        run: terraform apply -input=false -target=module.aks -auto-approve

      - name: Terraform Apply (Phase 2 - Full)
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.combined != 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
        run: terraform apply -input=false -auto-approve

      - name: Apply approved post-merge workloads plan
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.action == 'apply-workloads-plan'
        env:
          PLAN_RUN_ID: ${{ github.event.inputs.plan_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Provide the run ID shown in the successful post-merge workloads plan." >&2
            exit 1
          fi
          prefix="plans/dev/post-merge/${PLAN_RUN_ID}"
          az storage blob download \
            --auth-mode login \
            --account-name tfstate4459 \
            --container-name tfstate \
            --name "${prefix}/workloads.tfplan" \
            --file tfplan \
            --only-show-errors \
            --output none
          az storage blob download \
            --auth-mode login \
            --account-name tfstate4459 \
            --container-name tfstate \
            --name "${prefix}/workloads.json" \
            --file plan-metadata.json \
            --only-show-errors \
            --output none
          plan_sha="$(jq -r .source_sha plan-metadata.json)"
          current_root_tree="$(git rev-parse HEAD:infrastructure/environments/dev/workloads)"
          current_modules_tree="$(git rev-parse HEAD:infrastructure/modules)"
          git merge-base --is-ancestor "$plan_sha" HEAD
          jq -e \
            --arg run_id "$PLAN_RUN_ID" \
            --arg root_tree "$current_root_tree" \
            --arg modules_tree "$current_modules_tree" \
            '.run_id == $run_id and .root_tree == $root_tree and .modules_tree == $modules_tree' \
            plan-metadata.json > /dev/null || {
              echo "Plan is stale or does not match current main; refusing to apply." >&2
              exit 1
            }
          terraform apply -input=false -auto-approve tfplan
          az storage blob delete --auth-mode login --account-name tfstate4459 --container-name tfstate --name "${prefix}/workloads.tfplan" --only-show-errors --output none
          az storage blob delete --auth-mode login --account-name tfstate4459 --container-name tfstate --name "${prefix}/workloads.json" --only-show-errors --output none

      # --- BACKUP GATE TRƯỚC KHI DESTROY ---
      - name: Get AKS Credentials
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          # Lấy thông tin kết nối K8s để chạy lệnh kubectl
          az aks get-credentials --resource-group rg-tasktracker-dev --name aks-tasktracker-dev --overwrite-existing

      - name: Trigger and Wait for Backup Job
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          echo "Bắt đầu tạo Job Backup thủ công từ CronJob..."
          JOB_NAME="manual-backup-before-destroy-$(date +%s)"
          
          # Tạo Job từ CronJob hiện có
          kubectl create job --from=cronjob/tracker-db-backup $JOB_NAME -n dev
          
          echo "Đang chờ Job backup hoàn thành (Timeout: 10 phút)..."
          # Lệnh wait này sẽ chặn CI lại cho đến khi Job báo 'Complete'
          if kubectl wait --for=condition=complete job/$JOB_NAME -n dev --timeout=600s; then
            echo "✅ Backup hoàn tất thành công. Cho phép tiến hành Destroy!"
          else
            echo "❌ Lỗi: Job backup thất bại hoặc quá thời gian. HỦY BỎ QUÁ TRÌNH DESTROY để bảo toàn dữ liệu!"
            # Hiển thị log để debug
            kubectl logs -l job-name=$JOB_NAME -n dev
            exit 1 # Báo lỗi cho GitHub Actions để dừng luồng
          fi
      
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve

      - name: Update ArgoCD AKV Values
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.combined != 'true') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'apply' || (github.ref == 'refs/heads/main' && github.event.inputs.action == 'apply-workloads-plan')))
        run: |
          terraform output -json > tf_outputs.json
          KV_NAME=$(jq -r '.keyvault_name.value' tf_outputs.json)
          TENANT_ID=$(jq -r '.tenant_id.value' tf_outputs.json)
          BACKUP_CLIENT_ID=$(jq -r '.backup_client_id.value' tf_outputs.json)
          BACKUP_SA_NAME=$(jq -r '.backup_storage_account_name.value' tf_outputs.json)
          CERT_MANAGER_CLIENT_ID=$(jq -r '.cert_manager_client_id.value' tf_outputs.json)
          DNS_ZONE_NAME=$(jq -r '.dns_zone_name.value' tf_outputs.json)
          DNS_RG_NAME=$(jq -r '.shared_rg_name.value' tf_outputs.json)
          SUB_ID=$(jq -r '.subscription_id.value' tf_outputs.json)
          LOKI_CLIENT_ID=$(jq -r '.loki_client_id.value' tf_outputs.json)
          LOKI_STORAGE_ACCOUNT=$(jq -r '.loki_storage_account_name.value' tf_outputs.json)
          
          cd ../../../../
          # Ghi đè vào file, đẩy tất cả vào thụt lề của global:
          cat <<EOF > deploy/environments/dev/akv-values.yaml
          global:
            keyvaultName: "$KV_NAME"
            tenantId: "$TENANT_ID"
            backupClientId: "$BACKUP_CLIENT_ID"
            backupStorageAccount: "$BACKUP_SA_NAME"
            certManagerClientId: "$CERT_MANAGER_CLIENT_ID"
            dnsZoneName: "$DNS_ZONE_NAME"
            dnsResourceGroup: "$DNS_RG_NAME"
            subscriptionId: "$SUB_ID"
          EOF

          # Đồng bộ Workload Identity và Storage Account của Loki từ Terraform.
          sed -i "s/accountName: .*/accountName: \"$LOKI_STORAGE_ACCOUNT\"/" deploy/environments/dev/loki-values.yaml
          sed -i "s#azure.workload.identity/client-id: .*#azure.workload.identity/client-id: \"$LOKI_CLIENT_ID\"#" deploy/environments/dev/loki-values.yaml
          sed -i "s/userAssignedId: .*/userAssignedId: \"$LOKI_CLIENT_ID\"/" deploy/environments/dev/loki-values.yaml
          
          # Nối mảng keyvault_clients ở bên ngoài global
          echo "keyvault_clients:" >> deploy/environments/dev/akv-values.yaml
          jq -r '.backend_client_ids.value | to_entries | .[] | "  \(.key): \(.value)"' infrastructure/environments/dev/workloads/tf_outputs.json >> deploy/environments/dev/akv-values.yaml

          # --- THÊM ĐOẠN NÀY ĐỂ SINH FILE CERT-MANAGER-VALUES TỰ ĐỘNG ---
          cat <<EOF > deploy/environments/dev/cert-manager-values.yaml
          installCRDs: true
          podLabels:
            azure.workload.identity/use: "true"
          serviceAccount:
            create: true
            name: cert-manager
            annotations:
              azure.workload.identity/client-id: "$CERT_MANAGER_CLIENT_ID"
              azure.workload.identity/tenant-id: "$TENANT_ID"
          EOF

          # Cấu hình git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add các file values đã được đồng bộ vào Staging Area
          git add deploy/environments/dev/akv-values.yaml deploy/environments/dev/cert-manager-values.yaml deploy/environments/dev/loki-values.yaml
          
          # Kiểm tra xem Staging Area có bất kỳ thay đổi nào không (không chỉ định tên file)
          if ! git diff --staged --quiet; then
            git commit -m "chore(infra): sync terraform outputs to observability values [skip ci]"
            git push
            echo "✅ Đã commit và push cấu hình mới thành công."
          else
            echo "✅ Không có sự thay đổi nào ở các file values. Bỏ qua commit."
          fi

  comment-on-pr:
    needs: [changes, persistent, workloads]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.persistent == 'true' || needs.changes.outputs.workloads == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PERSISTENT_CHANGED: ${{ needs.changes.outputs.persistent }}
          WORKLOADS_CHANGED: ${{ needs.changes.outputs.workloads }}
          COMBINED: ${{ needs.changes.outputs.combined }}
          PERSISTENT_RESULT: ${{ needs.persistent.result }}
          WORKLOADS_RESULT: ${{ needs.workloads.result }}
          WORKLOADS_DEFERRED: ${{ needs.workloads.outputs.deferred }}
          WORKLOADS_ADVISORY: ${{ needs.workloads.outputs.advisory_result }}
        with:
          script: |
            const env = process.env;
            const persistent = env.PERSISTENT_CHANGED === "true" ? env.PERSISTENT_RESULT : "not changed";
            const workloads = env.WORKLOADS_CHANGED === "true"
              ? (env.COMBINED === "true" ? `deferred (best-effort plan: ${env.WORKLOADS_ADVISORY}; never applied)` : env.WORKLOADS_RESULT)
              : "not changed";
            const body = [
              "## Terraform stack plan status",
              "",
              `- Persistent: ${persistent}`,
              `- Workloads: ${workloads}`,
              env.COMBINED === "true"
                ? "The workloads plan is deferred because it reads persistent remote-state outputs not written until persistent is applied. After merge, persistent applies first; CI then plans workloads again from main. Review that new plan and dispatch `apply-workloads-plan` with its run ID. The PR workloads plan will not be applied."
                : "Only changed stacks are planned in this PR; existing post-merge deployment behavior is unchanged."
            ].join("\n");
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number, body
            });

  infra-gate:
    needs: [changes, persistent, workloads, comment-on-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify Terraform pipeline results
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTION: ${{ github.event.inputs.action }}
          PERSISTENT_CHANGED: ${{ needs.changes.outputs.persistent }}
          WORKLOADS_CHANGED: ${{ needs.changes.outputs.workloads }}
          COMBINED: ${{ needs.changes.outputs.combined }}
          PERSISTENT_RESULT: ${{ needs.persistent.result }}
          WORKLOADS_RESULT: ${{ needs.workloads.result }}
          WORKLOADS_DEFERRED: ${{ needs.workloads.outputs.deferred }}
          COMMENT_RESULT: ${{ needs.comment-on-pr.result }}
        run: |
          set -euo pipefail
          fail() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PERSISTENT_CHANGED" == "true" ]]; then
              [[ "$PERSISTENT_RESULT" == "success" ]] || fail "Persistent plan or Checkov failed."
            fi
            if [[ "$WORKLOADS_CHANGED" == "true" ]]; then
              [[ "$WORKLOADS_RESULT" == "success" ]] || fail "Workloads validation, Checkov, or best-effort plan step failed outside its tolerated plan error."
            fi
            if [[ "$COMBINED" == "true" ]]; then
              [[ "$PERSISTENT_RESULT" == "success" ]] || fail "Workloads deferral is invalid because persistent did not plan successfully."
              [[ "$WORKLOADS_DEFERRED" == "true" ]] || fail "Combined-stack workloads plan was not explicitly marked deferred."
            fi
            if [[ "$PERSISTENT_CHANGED" == "true" || "$WORKLOADS_CHANGED" == "true" ]]; then
              [[ "$COMMENT_RESULT" == "success" ]] || fail "Terraform PR status comment was not posted."
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PERSISTENT_CHANGED" == "true" ]]; then
              [[ "$PERSISTENT_RESULT" == "success" ]] || fail "Persistent apply failed."
            fi
            if [[ "$WORKLOADS_CHANGED" == "true" ]]; then
              [[ "$WORKLOADS_RESULT" == "success" ]] || fail "Workloads apply or post-merge plan failed."
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$ACTION" == "apply-workloads-plan" ]]; then
              [[ "$REF" == "refs/heads/main" ]] || fail "Post-merge workload plans can only be applied from main."
            fi
            [[ "$WORKLOADS_RESULT" == "success" ]] || fail "Requested workloads action failed."
          fi
          echo "Terraform pipeline gate passed." | tee -a "$GITHUB_STEP_SUMMARY"
